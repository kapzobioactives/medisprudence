tion exposure, treatment necessity analysis, documentation action list. Pre-mediation specimen.<\/p><div class=\"card-price\">View specimen →<\/div><\/a>\n    <\/div>\n    <div class=\"card-grid card-grid-3\" style=\"margin-bottom:12px\">\n      <a class=\"card\" href=\"specimens/specimen-cmip-pi.html\" target=\"_blank\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\/path><polyline points=\"14 2 14 8 20 8\"><\/polyline><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"><\/line><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\/line><line x1=\"10\" y1=\"9\" x2=\"8\" y2=\"9\"><\/line><\/svg><\/div><h4>Full Intelligence Report — PI Spine<\/h4><p>Seven-component CMIP for a personal injury spine matter. All components demonstrated with fictional data. Most complete specimen.<\/p><div class=\"card-price\">View specimen →<\/div><\/a>\n      <a class=\"card\" href=\"specimens/specimen-cmip-medmal.html\" target=\"_blank\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\/path><polyline points=\"14 2 14 8 20 8\"><\/polyline><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"><\/line><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\/line><line x1=\"10\" y1=\"9\" x2=\"8\" y2=\"9\"><\/line><\/svg><\/div><h4>Full Intelligence Report — Med-Mal<\/h4><p>Seven-component CMIP for a medical malpractice delayed-diagnosis matter. Standard-of-care analysis demonstrated.<\/p><div class=\"card-price\">View specimen →<\/div><\/a>\n      <a class=\"card\" href=\"specimens/specimen-cmip-pi.html\" target=\"_blank\" style=\"border-left:3px solid var(--ink-3)\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\/path><\/svg><\/div><h4>Defense Vulnerability Analysis<\/h4><p>Component 06 of the CMIP specimen — ranked High / Moderate / Low pressure mapping across the full record.<\/p><div class=\"card-price\">View in CMIP specimen →<\/div><\/a>\n    <\/div>\n    <div class=\"card-grid card-grid-3\" style=\"margin-bottom:36px\">\n      <a class=\"card\" href=\"specimens/specimen-cmip-pi.html\" target=\"_blank\" style=\"border-left:3px solid var(--ink-3)\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\/path><\/svg><\/div><h4>Expert Readiness Brief<\/h4><p>Component 07 of the CMIP specimen — specialty match, key record issues, Daubert readiness assessment, and documentation action list.<\/p><div class=\"card-price\">View in CMIP specimen →<\/div><\/a>\n      <a class=\"card\" href=\"specimens/specimen-cmip-pi.html\" target=\"_blank\" style=\"border-left:3px solid var(--ink-3)\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"><\/path><\/svg><\/div><h4>Pre-existing Condition Dossier<\/h4><p>Component 04 of the CMIP specimen — prior pathology documentation impact analysis with defense weighting assessment.<\/p><div class=\"card-price\">View in CMIP specimen →<\/div><\/a>\n      <a class=\"card\" href=\"specimens/specimen-cmip-pi.html\" target=\"_blank\" style=\"border-left:3px solid var(--ink-3)\"><div class=\"service-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><polyline points=\"12 6 12 12 16 14\"><\/polyline><\/svg><\/div><h4>Treatment Gap Analysis<\/h4><p>Component 05 of the CMIP specimen — every gap mapped with mediation and trial pressure intensity ratings.<\/p><div class=\"card-price\">View in CMIP specimen →<\/div><\/a>\n    <\/div>\n    <div style=\"background:var(--bg-alt);border-radius:var(--r-lg);padding:18px 24px;margin-bottom:40px;border:1px solid var(--rule-md)\">\n      <p style=\"font-size:15.5px;color:var(--ink);margin:0\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\/path><\/svg> <strong style=\"color:var(--ink)\">Defense Vulnerability Analysis, Expert Readiness Brief, Pre-existing Condition Dossier, and Treatment Gap Analysis<\/strong> are components within the Full Intelligence Report (CMIP™). They are demonstrated in the CMIP specimens above. Each is also available as a standalone service — contact for pricing.<\/p>\n    <\/div>\n\n    <div class=\"label\" style=\"margin-bottom:14px\">IME Deconstruction Outcomes<\/div>\n    <div class=\"card-grid card-grid-3\" style=\"margin-bottom:32px\">\n      <div class=\"result-card\"><div class=\"rc-type\">Personal Injury · Lumbar Spine · Florida<\/div><div class=\"rc-headline\">Defense Orthopedic IME — Internal Contradiction<\/div><p class=\"rc-outcome\">IME documented positive SLR at 40°, diminished ankle reflex, antalgic gait (p.7). Concluded “primarily subjective with limited objective findings” (p.12). Report identified internal contradiction. 22 deposition questions delivered.<\/p><\/div>\n      <div class=\"result-card\"><div class=\"rc-type\">Personal Injury · Cervical Spine · Texas<\/div><div class=\"rc-headline\">Defense Neurology IME — Omitted Imaging<\/div><p class=\"rc-outcome\">IME stated “no causal relationship.” Pre-accident MRI showed no herniation at C5-C6. Post-accident MRI showed new herniation with nerve root compression. IME report did not acknowledge or compare the two studies. 8 omitted facts identified.<\/p><\/div>\n      <div class=\"result-card\"><div class=\"rc-type\">Med-Mal · Surgical · New York<\/div><div class=\"rc-headline\">Defense Expert Report — Methodology Gaps<\/div><p class=\"rc-outcome\">Defense expert concluded the surgical complication was “within the acceptable range of outcomes.” Report identified that the review did not address the operative note documentation of the departure from the standard surgical sequence. Four methodology gaps identified.<\/p><\/div>\n    <\/div>\n\n    <div class=\"label\" style=\"margin-bottom:14px\">Case Viability Screening Outcomes<\/div>\n    <div class=\"card-grid card-grid-3\" style=\"margin-bottom:32px\">\n      <div class=\"result-card\"><div class=\"rc-type\">MVA · Cervical Radiculopathy · California<\/div><div class=\"rc-headline\">CVA — ACDF Surgical Case<\/div><p class=\"rc-outcome\">44-year-old female, rear-end at 40 mph. CVA identified: conservative care documented and completed (strong); objective imaging present and level-concordant (strong); EMG report not cross-referenced in surgeon’s note (addressable gap); pre-existing C5-C6 degeneration not addressed (high-pressure vulnerability).<\/p><\/div>\n      <div class=\"result-card\"><div class=\"rc-type\">Med-Mal · Delayed Diagnosis · Pennsylvania<\/div><div class=\"rc-headline\">CVA — Colorectal Cancer Failure to Diagnose<\/div><p class=\"rc-outcome\">52-year-old male, 14-month diagnostic delay. CVA identified three documentation gaps. Correct expert: colorectal surgeon, not oncologist. Documentation action list provided before expert engagement.<\/p><\/div>\n      <div class=\"result-card\"><div class=\"rc-type\">TBI · Construction · Georgia<\/div><div class=\"rc-headline\">CVA — Traumatic Brain Injury<\/div><p class=\"rc-outcome\">38-year-old construction foreman, pedestrian vs. commercial vehicle. TBI with epidural hematoma, tibial plateau fracture, hearing loss. CVA identified strong causation documentation with two addressable gaps before expert engagement.<\/p><\/div>\n    <\/div>\n\n    <div class=\"label\" style=\"margin-bottom:14px\">Defense Medical Lens™ Outcomes<\/div>\n    <div class=\"card-grid card-grid-2\">\n      <div class=\"result-card\"><div class=\"rc-type\">Bad Faith · Health Insurance Denial · Texas<\/div><div class=\"rc-headline\">Defense Medical Lens — Pre-Mediation Bad Faith Case<\/div><p class=\"rc-outcome\">Plaintiff attorney retained 30 days before mediation. Defense Medical Lens identified two ranked High-pressure points. Attorney addressed both in supplemental treating physician documentation before mediation. Settled above reserve.<\/p><\/div>\n      <div class=\"result-card\"><div class=\"rc-type\">Personal Injury · Soft Tissue · Florida<\/div><div class=\"rc-headline\">Defense Medical Lens — High-Bill Soft Tissue Case<\/div><p class=\"rc-outcome\">Ranked High: functional impairment documentation inconsistent across three treating providers. Ranked Moderate: treatment frequency not supported by documented pain levels. Attorney used documentation action list to obtain updated treating physician records before mediation conference.<\/p><\/div>\n    <\/div>\n    <div style=\"margin-top:32px;text-align:center\"><a class=\"btn btn-primary\" href=\"/intake\">Request Case Review →<\/a><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-about\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">About Medisprudence<\/div>\n    <h1 style=\"margin-top:10px\">Built from first-hand payer-side review.<\/h1>\n    <p class=\"hero-sub\">Medisprudence exists because of one specific professional experience that no physician-legal consulting competitor has: a physician with 3,000+ payer-side US claim reviews under InterQual and MCG, before entering the litigation support market.<\/p>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"founder-card\">\n      <div class=\"founder-avatar\">AK<\/div>\n      <div>\n        <h3 style=\"font-size:clamp(20px,2.5vw,32px);margin-bottom:5px\">Dr. Arun Kasturi, MBBS<\/h3>\n        <div class=\"label\" style=\"margin-bottom:14px\">Founder — Medisprudence<\/div>\n        <p style=\"font-size:15px;color:var(--ink);line-height:1.75;max-width:680px\">Dr. Kasturi is an MBBS physician with a background that spans clinical medicine, US payer-side utilization-review work under InterQual and MCG, and legal training (LLB). He founded Medisprudence to bring the documentation-threshold discipline developed through payer-side review into the litigation support market — where that perspective is directly useful to attorneys and exactly what no competitor currently offers.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"credential-grid\">\n      <div class=\"credential\"><div class=\"cr-label\">Clinical<\/div><p>MBBS physician with clinical experience across internal medicine and multi-system pathology. Foundation for causation, mechanism, and treatment-record analysis.<\/p><\/div>\n      <div class=\"credential\"><div class=\"cr-label\">Payer Review — The Defining Credential<\/div><p>Payer-side US claim review at scale. Applied InterQual and MCG criteria across 3,000+ cases. This is the background no competitor has.<\/p><\/div>\n      <div class=\"credential\"><div class=\"cr-label\">Legal Training<\/div><p>LLB (in progress). Analysis is framed around litigation decisions — not patient treatment decisions. Work product is designed for attorney use.<\/p><\/div>\n      <div class=\"credential\"><div class=\"cr-label\">Litigation Framework<\/div><p>Understanding of payer utilization management operations, claims evaluation, and how defense medical theories are constructed, from first-hand criteria application.<\/p><\/div>\n      <div class=\"credential\"><div class=\"cr-label\">Disclosure-First Operation<\/div><p>India-based operation disclosed before records are accepted. Cross-border processing disclosed before PHI is transmitted. AI use disclosed at the component level on every deliverable.<\/p><\/div>\n      <div class=\"credential\"><div class=\"cr-label\">Role Boundary<\/div><p>Medisprudence provides medical consulting under attorney direction. No legal advice, no patient care, no independent expert testimony, no court appearances unless separately contracted.<\/p><\/div>\n    <\/div>\n    <div style=\"margin-top:40px;background:var(--bg-alt);border-radius:var(--r-xl);padding:32px 40px\">\n      <div class=\"label\">The Background That Defines Medisprudence<\/div>\n      <h3 style=\"font-size:clamp(18px,2.5vw,26px);margin:10px 0 16px\">What 3,000+ payer reviews teach you about litigation<\/h3>\n      <p style=\"font-size:15px;color:var(--ink);line-height:1.8;max-width:740px\">On the payer side, physician reviewers evaluate thousands of claims against specific criteria — InterQual levels of care, MCG surgical appropriateness guidelines, and payer-specific medical necessity thresholds. The question in every review is the same question a defense IME physician asks: does this record document the clinical necessity for the treatment claimed?<\/p>\n      <p style=\"font-size:15px;color:var(--ink);line-height:1.8;max-width:740px;margin-top:14px\">After 3,000+ of those reviews, the documentation patterns that make a claim defensible and the gaps that make it vulnerable become precise and specific knowledge — not clinical opinion. You know exactly which absence of conservative care documentation will trigger a surgery denial. You know which imaging findings without EMG cross-reference leave a radiculopathy claim exposed. You know which treatment gap lengths require clinical explanation and which ones do not.<\/p>\n      <p style=\"font-size:15.5px;color:var(--ink);margin-top:16px;font-style:italic\">Medisprudence does not use confidential, proprietary, or plan-specific information from any current or prior employer. All analysis is based on publicly available clinical guidelines and general utilization review methodology.<\/p>\n    <\/div>\n    <div class=\"svc-detail-grid\" style=\"margin-top:28px\">\n      <div style=\"background:var(--bg-alt);border-radius:var(--r-lg);padding:24px\">\n        <h4 style=\"margin-bottom:14px;color:var(--teal)\">Cases Medisprudence reviews<\/h4>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:9px\">\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>PI and med-mal matters with disputed causation, injury severity, or treatment necessity<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>Cases where a defense IME has been received<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>Pre-existing condition arguments, treatment gaps, surgery disputes, TBI/spine/ortho<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>Matters where counsel is deciding whether to retain an expert<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>Cases approaching mediation where defense medical theory is unknown<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--teal)\">✓<\/span>Bad faith insurance denial litigation where criteria application is disputed<\/li>\n        <\/ul>\n      <\/div>\n      <div style=\"background:rgba(217,48,37,.04);border-radius:var(--r-lg);padding:24px\">\n        <h4 style=\"margin-bottom:14px;color:var(--danger)\">Work Medisprudence declines<\/h4>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:9px\">\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--danger)\">✗<\/span>Same-day deadlines where careful physician review is not possible<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--danger)\">✗<\/span>Requests for legal strategy, damages valuation, or court filings<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--danger)\">✗<\/span>Patient care, treating advice, or independent medical examinations<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--danger)\">✗<\/span>Undisclosed expert testimony or expert affidavits<\/li>\n          <li style=\"font-size:15.5px;color:var(--ink);padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;color:var(--danger)\">✗<\/span>Pure chronology-only projects with no analytical layer needed<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-faq\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">Frequently Asked Questions<\/div>\n    <h1 style=\"margin-top:10px\">Questions attorneys ask before engaging<\/h1>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\" style=\"max-width:760px\">\n    <div class=\"label\" style=\"margin-bottom:14px\">About the Service<\/div><div class=\"faq-item\"><div class=\"faq-q\">What exactly does Medisprudence deliver — and what does it not deliver? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Medisprudence delivers physician-authored medical case intelligence: IME report deconstruction, case viability screening, defense vulnerability analysis, Defense Medical Lens pre-mediation reports, expert readiness briefs, and related intelligence documents. It does not deliver legal advice, legal strategy, damages valuation, expert testimony, expert affidavits, certificates of merit, court appearances, patient care, or independent medical examinations. All work is delivered under attorney direction.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">How is Medisprudence different from a legal nurse consultant? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Legal nurse consultants are registered nurses who review medical records and produce chronologies and summaries. That is valuable for extraction and organization. Medisprudence adds the physician interpretation layer — what the organized record means for causation, for the IME response, for the expert, and for the demand. More specifically, Medisprudence’s founding physician has reviewed 3,000+ US claims as a payer-side utilization-review physician under InterQual and MCG — a background no LNC firm has. Our analysis is calibrated to how defense reviewers actually evaluate records, not just what the clinical picture shows.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">How is Medisprudence different from retaining a medical expert witness? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>A medical expert witness is a testifying expert — retained for opinion, deposition, and trial. Medisprudence is a non-testifying consulting physician — retained for pre-expert case intelligence before the expert engagement. The two are complementary, not competing: Medisprudence helps you decide whether to retain an expert, which specialty you need, and what documentation must be in place before the expert reviews the file. The cost of Medisprudence is a fraction of most expert retainer entry costs.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">What is the Defense Medical Lens™ and why can’t I get this elsewhere? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>The Defense Medical Lens is a physician-authored simulation of how a defense-side medical reviewer would evaluate the record — built from the perspective of someone who performed that exact review function. Our founding physician has applied InterQual and MCG criteria across 3,000+ US payer-side claim reviews under real claims conditions. It is calibrated against InterQual, MCG, and the medical-necessity logic that defense reviewers operate under — applied first-hand by the founding physician across those reviews. No other physician-legal consulting firm in the market has this background.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">Can Medisprudence serve both plaintiff and defense? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Yes. Medisprudence serves both plaintiff and defense clients under conflict-screened, separate engagements. We do not serve both sides of the same matter. Conflict checks are conducted at intake. Defense and TPA engagements are available for reserve-setting medical exposure analysis, pre-mediation medical review, and WC causation assessment.<\/p><\/div><\/div><div class=\"label\" style=\"margin-bottom:14px;margin-top:28px\">About Privacy and Process<\/div><div class=\"faq-item\"><div class=\"faq-q\">Do I have to send records to start? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>No. The first step is deliberately low-friction. You send only general case facts — case type, injury, IME status, approximate record volume, deadline, and the decision you need to make. Do not send PHI by email. Medisprudence confirms scope, pricing, turnaround, and conflict status. BAA and engagement terms are confirmed before any records are transmitted.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">Medisprudence is operated from India. Does that create any issues? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Cross-border processing is disclosed before any records are accepted and before engagement is formed. This is a deliberate transparency policy. The BAA executed before engagement governs PHI handling under the cross-border framework. All AI-assisted extraction uses systems covered by appropriate contractual safeguards. PHI is not entered into public consumer AI tools. Records are not used for model training.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">How does Medisprudence handle AI in its work product? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>AI-assisted extraction is used in Stage 1 of the workflow — capturing dates, providers, diagnoses, procedures, and page references from medical records. This produces structured data, not intelligence. Stage 2 is physician-authored: the founding physician reviews extracted data against original records and applies all clinical intelligence layers. Every deliverable identifies AI-assisted versus physician-authored components at the component level.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">Does Medisprudence provide expert testimony? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>No. Medisprudence does not provide independent expert testimony, expert affidavits, certificates of merit, or court-facing causation opinions. This is by design. The non-testifying consulting role is structurally distinct from the expert witness role — it eliminates conflicts, allows more candid analysis, and keeps pricing accessible.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">What is the typical turnaround? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Case Viability Screening (CVA): 72 hours standard. IME Report Deconstruction: 3–5 business days. Defense Medical Lens add-on: 48 hours. Defense Medical Lens standalone: 3–4 days. Full Intelligence Report (CMIP): 5–10 business days depending on record volume. Rush options are available and confirmed at scope.<\/p><\/div><\/div><div class=\"faq-item\"><div class=\"faq-q\">What does it cost? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Case Viability Screening starts at $350. IME Report Deconstruction starts at $500. Defense Medical Lens starts at $400 as an add-on, $950 standalone. Full Intelligence Report (CMIP) starts at $1,500. All fees are confirmed at scope. No contingent-fee arrangements are available. <a href=\"/packages\" style=\"color:var(--teal)\">Bundled packages are available from $800<\/a> — below à la carte rates, structured as a single case cost advance.<\/p><\/div><\/div>\n    <div class=\"faq-item\"><div class=\"faq-q\">Can fees be advanced as case costs and recovered at settlement? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>Yes — and this is how most plaintiff attorneys structure Medisprudence fees. In a contingency-fee practice, Medisprudence fees are advanced as case costs against the matter and recovered from settlement proceeds, the same way you would advance expert consultation, medical record retrieval, or investigation costs. Medisprudence is paid at invoice — the case cost recovery is your firm’s internal accounting decision, not a Medisprudence payment arrangement. This means there is no new budget category required: Medisprudence fees fit the case cost line item that already exists in every plaintiff practice.<\/p><\/div><\/div>\n    <div class=\"faq-item\"><div class=\"faq-q\">Is deferred billing available for established clients? <span class=\"faq-chevron\">▾<\/span><\/div><div class=\"faq-a\"><p>For established attorney clients on confirmed retainer arrangements, deferred billing — where the engagement fee is invoiced at case resolution rather than upon delivery — can be discussed at scope confirmation. This is not available for first-time engagements. Contact Medisprudence to discuss whether your firm’s case volume and practice area make a deferred billing arrangement appropriate.<\/p><\/div><\/div>\n    <div style=\"margin-top:36px;background:var(--bg-alt);border-radius:var(--r-xl);padding:28px 32px;text-align:center\">\n      <h3 style=\"font-size:20px;margin-bottom:10px\">Still have questions?<\/h3>\n      <p style=\"margin-bottom:16px\">Start with a no-PHI inquiry — describe the case type and the decision you need to make.<\/p>\n      <a class=\"btn btn-primary\" href=\"/intake\">Request Case Review<\/a>\n      <a class=\"btn btn-ghost\" href=\"/contact\" style=\"margin-left:10px\">Send a Message<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-contact\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">Contact<\/div>\n    <h1 style=\"margin-top:10px\">Get in touch<\/h1>\n    <p class=\"hero-sub\">For general inquiries, partnership discussions, or questions before submitting a case review request.<\/p>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"svc-detail-grid\">\n      <div>\n        <h3 style=\"font-size:20px;margin-bottom:18px\">Direct contact<\/h3>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"padding:18px;background:var(--bg-alt);border-radius:var(--r-md)\"><div class=\"label-dim\" style=\"margin-bottom:5px\">Email<\/div><a href=\"mailto:contact@medisprudence.com\" style=\"font-size:15px;color:var(--teal)\">contact@medisprudence.com<\/a><p style=\"font-size:13px;margin-top:5px\">For general inquiries. Do not send PHI by email.<\/p><\/div>\n          <div style=\"padding:18px;background:var(--bg-alt);border-radius:var(--r-md)\"><div class=\"label-dim\" style=\"margin-bottom:5px\">Case Review Requests<\/div><p style=\"font-size:14px;color:var(--ink)\">Use the <a href=\"/intake\" style=\"color:var(--teal)\">Request Case Review form<\/a> — it structures the information Medisprudence needs to confirm scope without PHI.<\/p><\/div>\n          <div style=\"padding:18px;background:var(--bg-alt);border-radius:var(--r-md)\"><div class=\"label-dim\" style=\"margin-bottom:5px\">Partnership &amp; White-Label<\/div><p style=\"font-size:14px;color:var(--ink)\">LNC firms interested in white-label arrangements: email with subject line “Partnership Inquiry.”<\/p><\/div>\n          <div style=\"padding:18px;background:var(--bg-alt);border-radius:var(--r-md)\"><div class=\"label-dim\" style=\"margin-bottom:5px\">Response Time<\/div><p style=\"font-size:14px;color:var(--ink)\">General inquiries: within 1 business day. Case review requests via the intake form: same business day scope confirmation.<\/p><\/div>\n        <\/div>\n      <\/div>\n      <div>\n        <h3 style=\"font-size:20px;margin-bottom:18px\">Before you write<\/h3>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div class=\"when-item\"><p><strong>For case review:<\/strong> Use the Request Case Review form — it gathers the right information without requiring PHI upfront.<\/p><\/div>\n          <div class=\"when-item\"><p><strong>For scope questions:<\/strong> Describe the case type, the injury, the decision you need to make, and your deadline.<\/p><\/div>\n          <div class=\"when-item\"><p><strong>For white-label inquiry:<\/strong> Describe your firm, your attorney client volume, and the services where you currently refer out physician-level analysis requests.<\/p><\/div>\n          <div class=\"when-item\"><p><strong>For bad faith cases:<\/strong> Mention the denial type, the criteria system referenced in the denial letter, and whether you have the peer-to-peer review documentation.<\/p><\/div>\n        <\/div>\n        <a class=\"btn btn-primary\" href=\"/intake\" style=\"width:100%;margin-top:20px;justify-content:center\">Request Case Review →<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-intake\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">No-PHI Intake — Step 1 of 3<\/div>\n    <h1 style=\"margin-top:10px\">Request Case Review<\/h1>\n    <p class=\"hero-sub\">Do not send PHI by email or through this form. Describe the case type, injury, and the decision you need to make. Medisprudence will confirm scope, pricing, and conflict status before any records are requested.<\/p>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"svc-detail-grid\">\n      <div>\n        <div class=\"intake-form\" style=\"max-width:100%\">\n\n          <!-- SUCCESS STATE -->\n          <div id=\"intake-success\" style=\"display:none;padding:40px 0;text-align:center\">\n            <div style=\"width:52px;height:52px;background:var(--teal-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:22px\">✓<\/div>\n            <h3 style=\"font-size:22px;margin-bottom:10px\">Received<\/h3>\n            <p style=\"font-size:16px;color:var(--ink);max-width:400px;margin:0 auto\">Medisprudence will respond within one business day with scope confirmation, fee range, turnaround, and conflict status.<\/p>\n            <p style=\"font-size:13px;color:var(--ink-3);margin-top:14px\">Do not send PHI by email before a BAA is in place.<\/p>\n            <button type=\"button\" onclick=\"(function(){document.getElementById('intake-form-el').reset();document.getElementById('intake-form-el').style.display='block';document.getElementById('intake-success').style.display='none';window._intakeSubmitting=false;updateIntakeForm();})()\" style=\"margin-top:20px;background:none;border:1px solid var(--rule-md);border-radius:999px;padding:9px 22px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;font-family:var(--sans);transition:.2s\" onmouseover=\"this.style.borderColor='var(--teal)';this.style.color='var(--teal)'\" onmouseout=\"this.style.borderColor='var(--rule-md)';this.style.color='var(--ink-2)'\">Submit another inquiry<\/button>\n          <\/div>\n\n          <!-- FORM -->\n          <form id=\"intake-form-el\" onsubmit=\"submitIntakeForm(event)\">\n\n            <!-- BLOCK 1 — Always shown -->\n            <div class=\"form-row\">\n              <div class=\"form-group\">\n                <label for=\"f_name\">Your Name <span style=\"color:var(--danger)\">*<\/span><\/label>\n                <input type=\"text\" id=\"f_name\" name=\"name\" required=\"\" placeholder=\"First and last name\">\n              <\/div>\n              <div class=\"form-group\">\n                <label for=\"f_email\">Work Email <span style=\"color:var(--danger)\">*<\/span><\/label>\n                <input type=\"email\" id=\"f_email\" name=\"email\" required=\"\" placeholder=\"you@lawfirm.com\">\n              <\/div>\n            <\/div>\n\n            <div class=\"form-row\">\n              <div class=\"form-group\">\n                <label for=\"f_firm\">Firm or Company Name <span style=\"color:var(--danger)\">*<\/span><\/label>\n                <input type=\"text\" id=\"f_firm\" name=\"firm\" required=\"\" placeholder=\"Law firm or organisation\">\n              <\/div>\n              <div class=\"form-group\">\n                <label for=\"f_role\">Your Role <span style=\"color:var(--danger)\">*<\/span><\/label>\n                <select id=\"f_role\" name=\"role\" required=\"\">\n                  <option value=\"\">— Select —<\/option>\n                  <option>Plaintiff Attorney<\/option>\n                  <option>Defense Attorney<\/option>\n                  <option>Paralegal or Case Manager<\/option>\n                  <option>Legal Nurse Consultant<\/option>\n                  <option>TPA or Claims Manager<\/option>\n                  <option>Other<\/option>\n                <\/select>\n              <\/div>\n            <\/div>\n\n            <div class=\"form-group\">\n              <label for=\"f_service\">Service Requested <span style=\"color:var(--danger)\">*<\/span><\/label>\n              <select id=\"f_service\" name=\"service_requested\" required=\"\" onchange=\"updateIntakeForm()\">\n                <option value=\"\">— Select a service —<\/option>\n                <optgroup label=\"Packages\">\n                <option value=\"pkg-full\">Full Case Workup Package (CVA + IME + Defense Medical Lens)<\/option>\n                <option value=\"pkg-ime\">IME Response Package (IME Deconstruction + Defense Medical Lens)<\/option>\n                <\/optgroup>\n                <optgroup label=\"Individual Services\">\n                <option value=\"ime\">IME Report Deconstruction<\/option>\n                <option value=\"cva\">Case Viability Screening (CVA™)<\/option>\n                <option value=\"dml\">Defense Medical Lens™<\/option>\n                <option value=\"cmip\">Full Intelligence Report (CMIP™)<\/option>\n                <option value=\"dva\">Defense Vulnerability Analysis<\/option>\n                <option value=\"erb\">Expert Readiness Brief<\/option>\n                <option value=\"pec\">Pre-existing Condition Dossier<\/option>\n                <option value=\"tga\">Treatment Gap Analysis<\/option>\n                <\/optgroup>\n                <optgroup label=\"Partnership\">\n                <option value=\"white-label\">White-Label Partnership<\/option>\n                <\/optgroup>\n                <option value=\"not-sure\">Not sure — help me decide<\/option>\n              <\/select>\n            <\/div>\n\n            <!-- BLOCK 2 — Case context — hidden for White-Label Partnership -->\n            <div id=\"ib-case-context\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">Case Details<\/div>\n\n              <div class=\"form-row\">\n                <div class=\"form-group\">\n                  <label for=\"f_casetype\">Case Type<\/label>\n                  <select id=\"f_casetype\" name=\"case_type\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>PI — Auto / Trucking<\/option>\n                    <option>Medical Malpractice<\/option>\n                    <option>Bad Faith Insurance<\/option>\n                    <option>Workers Compensation Defense<\/option>\n                    <option>Mass Tort / MDL<\/option>\n                    <option>Other<\/option>\n                  <\/select>\n                <\/div>\n                <div class=\"form-group\">\n                  <label for=\"f_volume\">Approximate Record Volume<\/label>\n                  <select id=\"f_volume\" name=\"record_volume\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Under 200 pages<\/option>\n                    <option>200 – 500 pages<\/option>\n                    <option>500 – 1,000 pages<\/option>\n                    <option>1,000 – 3,000 pages<\/option>\n                    <option>Over 3,000 pages<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_injury\">Injury or Medical Issue<\/label>\n                <input type=\"text\" id=\"f_injury\" name=\"injury_or_medical_issue\" placeholder=\"e.g. Lumbar herniation, ACDF, TBI, failure to diagnose cancer, surgical complication\">\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 3 — IME Report Deconstruction only -->\n            <div id=\"ib-ime\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">IME Details<\/div>\n\n              <div class=\"form-row\">\n                <div class=\"form-group\">\n                  <label for=\"f_ime_specialty\">IME Physician Specialty<\/label>\n                  <select id=\"f_ime_specialty\" name=\"ime_physician_specialty\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Orthopedic Surgery<\/option>\n                    <option>Neurology<\/option>\n                    <option>Neurosurgery<\/option>\n                    <option>Psychiatry<\/option>\n                    <option>Physical Medicine &amp; Rehabilitation<\/option>\n                    <option>Occupational Medicine<\/option>\n                    <option>Other<\/option>\n                  <\/select>\n                <\/div>\n                <div class=\"form-group\">\n                  <label for=\"f_ime_depo\">Deposition Scheduled?<\/label>\n                  <select id=\"f_ime_depo\" name=\"deposition_scheduled\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Yes — date confirmed<\/option>\n                    <option>Yes — date TBD<\/option>\n                    <option>No<\/option>\n                    <option>Not yet decided<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_ime_conclusion\">IME Conclusion (one sentence)<\/label>\n                <input type=\"text\" id=\"f_ime_conclusion\" name=\"ime_conclusion\" placeholder=\"e.g. &quot;No causal relationship between the accident and the claimed spinal pathology&quot;\">\n              <\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_ime_records\">Do you have treating records to send alongside the IME?<\/label>\n                <select id=\"f_ime_records\" name=\"treating_records_available\">\n                  <option value=\"\">— Select —<\/option>\n                  <option>Yes, complete<\/option>\n                  <option>Yes, partial<\/option>\n                  <option>No — IME report only<\/option>\n                <\/select>\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 4 — Defense Medical Lens only -->\n            <div id=\"ib-dml\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">Mediation Details<\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_dml_mediation\">Do you have a mediation or settlement conference date?<\/label>\n                <select id=\"f_dml_mediation\" name=\"mediation_date_status\" onchange=\"updateIntakeForm()\">\n                  <option value=\"\">— Select —<\/option>\n                  <option>Yes — date confirmed<\/option>\n                  <option>Scheduled but not confirmed<\/option>\n                  <option>No — pre-mediation planning<\/option>\n                <\/select>\n              <\/div>\n\n              <div id=\"ib-dml-date\" style=\"display:none\">\n                <div class=\"form-group\">\n                  <label for=\"f_dml_date\">Mediation Date (approximate)<\/label>\n                  <input type=\"text\" id=\"f_dml_date\" name=\"mediation_date_approximate\" placeholder=\"e.g. June 2026 or 15 June 2026\">\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 5 — Case Viability Screening only -->\n            <div id=\"ib-cva\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">Viability Screening Details<\/div>\n\n              <div class=\"form-row\">\n                <div class=\"form-group\">\n                  <label for=\"f_cva_demand\">Has any prior demand been made on this case?<\/label>\n                  <select id=\"f_cva_demand\" name=\"prior_demand_made\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Yes<\/option>\n                    <option>No<\/option>\n                    <option>Unknown<\/option>\n                  <\/select>\n                <\/div>\n                <div class=\"form-group\">\n                  <label for=\"f_cva_expert\">Anticipated expert need?<\/label>\n                  <select id=\"f_cva_expert\" name=\"anticipated_expert_need\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Yes — expert already identified<\/option>\n                    <option>Yes — expert needed, not yet retained<\/option>\n                    <option>No<\/option>\n                    <option>Unknown<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 6 — Full Intelligence Report (CMIP) only -->\n            <div id=\"ib-cmip\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">Report Details<\/div>\n\n              <div class=\"form-row\">\n                <div class=\"form-group\">\n                  <label for=\"f_cmip_deadline\">Deadline or Case-Decision Milestone<\/label>\n                  <input type=\"text\" id=\"f_cmip_deadline\" name=\"deadline_or_milestone\" placeholder=\"e.g. Mediation in August, expert deadline 30 June\">\n                <\/div>\n                <div class=\"form-group\">\n                  <label for=\"f_cmip_expert\">Is an expert already retained?<\/label>\n                  <select id=\"f_cmip_expert\" name=\"expert_retained\">\n                    <option value=\"\">— Select —<\/option>\n                    <option>Yes<\/option>\n                    <option>No — this report will inform expert selection<\/option>\n                    <option>Not yet decided<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 7 — White-Label Partnership only -->\n            <div id=\"ib-wl\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"label-dim\" style=\"margin-bottom:14px\">Partnership Details<\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_wl_practice\">Describe your firm’s practice <span style=\"color:var(--danger)\">*<\/span><\/label>\n                <textarea id=\"f_wl_practice\" name=\"firm_practice_description\" rows=\"4\" maxlength=\"2000\" placeholder=\"Describe your firm type, the services you currently refer out for physician-level analysis, and what white-label arrangement you are exploring\"><\/textarea>\n              <\/div>\n\n              <div class=\"form-group\">\n                <label for=\"f_wl_volume\">Approximate monthly case volume<\/label>\n                <select id=\"f_wl_volume\" name=\"monthly_case_volume\">\n                  <option value=\"\">— Select —<\/option>\n                  <option>Under 10<\/option>\n                  <option>10 – 25<\/option>\n                  <option>25 – 50<\/option>\n                  <option>Over 50<\/option>\n                <\/select>\n              <\/div>\n            <\/div>\n\n            <!-- BLOCK 8 — Not sure only -->\n            <div id=\"ib-notsure\" style=\"display:none\">\n              <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n              <div class=\"form-group\">\n                <label for=\"f_notsure\">Describe the decision you need to make<\/label>\n                <textarea id=\"f_notsure\" name=\"decision_description\" rows=\"4\" maxlength=\"2000\" placeholder=\"Describe what you are trying to decide — Medisprudence will identify the right service and scope for you\"><\/textarea>\n              <\/div>\n            <\/div>\n\n            <!-- ALWAYS SHOWN — bottom -->\n            <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\/div>\n\n            <div class=\"form-group\">\n              <label for=\"f_notes\">Anything else Medisprudence should know? <span style=\"color:var(--ink-3);font-weight:400\">(optional)<\/span><\/label>\n              <textarea id=\"f_notes\" name=\"additional_notes\" rows=\"3\" maxlength=\"1000\" placeholder=\"Deadline, rush requirement, prior review history, or any other context\"><\/textarea>\n            <\/div>\n\n            <div class=\"form-group\">\n              <label for=\"f_source\">How did you hear about Medisprudence? <span style=\"color:var(--ink-3);font-weight:400\">(optional)<\/span><\/label>\n              <select id=\"f_source\" name=\"referral_source\">\n                <option value=\"\">— Select —<\/option>\n                <option>Attorney referral<\/option>\n                <option>Legal publication or newsletter<\/option>\n                <option>LinkedIn<\/option>\n                <option>Search engine<\/option>\n                <option>Other<\/option>\n              <\/select>\n            <\/div>\n\n            <div style=\"background:rgba(217,48,37,.04);border:1px solid rgba(217,48,37,.12);border-radius:var(--r-md);padding:12px 16px;margin-bottom:20px\">\n              <p style=\"font-size:12.5px;color:var(--ink-2);margin:0\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:middle;margin-right:4px;color:var(--caution)\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\/path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\/line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\/line><\/svg> <strong style=\"color:var(--ink)\">Do not include PHI in this form.<\/strong> No patient names, dates of birth, SSNs, MRNs, or other protected health information. PHI is transmitted only through the secure channel established after BAA execution.<\/p>\n            <\/div>\n\n            <button type=\"submit\" id=\"intake-submit-btn\" class=\"btn btn-primary\" style=\"width:100%;justify-content:center;padding:14px 24px;font-size:15px\">\n              Submit Case Review Request →\n            <\/button>\n            <p id=\"intake-error\" style=\"display:none;color:var(--danger);font-size:13px;margin-top:10px;text-align:center\"><\/p>\n\n          <\/form>\n        <\/div>\n\n        <script>\n        function updateIntakeForm(){\n          var svc = document.getElementById('f_service').value;\n          var med = document.getElementById('f_dml_mediation') ? document.getElementById('f_dml_mediation').value : '';\n\n          // Block 2 — hide for White-Label Partnership only\n          iv('ib-case-context', svc !== 'white-label');\n\n          // Block 3 — IME only (including IME response package)\n          iv('ib-ime', svc === 'ime' || svc === 'pkg-ime');\n\n          // Block 4 — DML only\n          iv('ib-dml', svc === 'dml');\n          iv('ib-dml-date', svc === 'dml' && med !== '' && med !== 'No \\u2014 pre-mediation planning');\n\n          // Block 5 — CVA only (including full package)\n          iv('ib-cva', svc === 'cva' || svc === 'pkg-full');\n\n          // Block 6 — CMIP only\n          iv('ib-cmip', svc === 'cmip');\n\n          // Block 7 — White-Label only\n          iv('ib-wl', svc === 'white-label');\n\n          // Block 8 — Not sure only\n          iv('ib-notsure', svc === 'not-sure');\n        }\n\n        function iv(id, show){\n          var el = document.getElementById(id);\n          if(el) el.style.display = show ? 'block' : 'none';\n        }\n\n        function submitIntakeForm(e){\n          e.preventDefault();\n          if(window._intakeSubmitting) return;\n          window._intakeSubmitting = true;\n          var btn = document.getElementById('intake-submit-btn');\n          var err = document.getElementById('intake-error');\n          btn.disabled = true;\n          btn.textContent = 'Sending\\u2026';\n          err.style.display = 'none';\n\n          var form = document.getElementById('intake-form-el');\n          var data = new FormData(form);\n\n          fetch('https://formspree.io/f/xnjwkapj', {\n            method: 'POST',\n            body: data,\n            headers: { 'Accept': 'application/json' }\n          })\n          .then(function(r){\n            if(r.ok){\n              form.style.display = 'none';\n              document.getElementById('intake-success').style.display = 'block';\n            } else {\n              r.json().then(function(d){\n                err.textContent = (d.errors && d.errors.map(function(x){return x.message}).join(', ')) || 'Submission failed. Please email contact@medisprudence.com directly.';\n                err.style.display = 'block';\n                btn.disabled = false;\n                btn.textContent = 'Submit Case Review Request \\u2192';\n                window._intakeSubmitting = false;\n              });\n            }\n          })\n          .catch(function(){\n            err.textContent = 'Network error. Please email contact@medisprudence.com directly.';\n            err.style page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">Data Security &amp; Privacy<\/div>\n    <h1 style=\"margin-top:10px\">How PHI is handled. How work product is protected.<\/h1>\n    \n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\" style=\"max-width:720px\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\"><div style=\"background:var(--teal-dim);border:1px solid rgba(122,31,43,.2);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:8px\"><h4 style=\"margin-bottom:8px\">The short version<\/h4><p style=\"font-size:14px;color:var(--ink)\">No PHI by email — ever. BAA executed before records are transmitted. Cross-border processing disclosed before engagement. PHI not entered into public AI tools. Records not used for model training. AI-assisted and physician-authored components disclosed at the component level on every deliverable.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">No-PHI intake path<\/h4><p style=\"font-size:14.5px\">The intake process begins without records. You send only general case facts. Scope, pricing, and conflict status are confirmed before any records are transmitted or any PHI is involved.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">Business Associate Agreement<\/h4><p style=\"font-size:14.5px\">A BAA is executed before PHI-containing records are accepted. The BAA governs retention, deletion, and use of PHI in accordance with HIPAA requirements. Cross-border processing under the BAA framework is disclosed before records are transmitted.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">Cross-border processing disclosure<\/h4><p style=\"font-size:14.5px\">Physician review is performed outside the United States. This is disclosed before engagement is formed and before records are transmitted. The disclosure is a deliberate transparency policy, not an inadvertent one.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">AI use in PHI-containing records<\/h4><p style=\"font-size:14.5px\">Where AI-assisted extraction is used for PHI-containing records, it is used only through systems covered by appropriate contractual safeguards including BAAs. PHI is not entered into public consumer AI tools. Records are not used for model training.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">Data retention<\/h4><p style=\"font-size:14.5px\">Retention and deletion is governed by the executed BAA. Default practice is to retain only what is needed for the defined scope and to delete upon instruction or engagement close.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-privacy\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">Privacy Policy<\/div>\n    <h1 style=\"margin-top:10px\">Privacy Policy<\/h1>\n    <p class=\"hero-sub\">Last updated: 2026. This policy applies to medisprudence.com and all Medisprudence services.<\/p>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\" style=\"max-width:720px\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\"><div><h4 style=\"margin-bottom:8px\">1. Scope<\/h4><p style=\"font-size:14.5px\">This policy governs information collected through the Medisprudence website and through service engagements. It does not apply to information governed by an executed Business Associate Agreement (BAA), which controls PHI handling separately.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">2. Information collected<\/h4><p style=\"font-size:14.5px\">Through inquiry forms: Name, email, firm name, role, case type, approximate record volume, and general case description. These forms exclude PHI by design. Through engagements: Once a BAA is executed, Medisprudence receives medical records containing PHI. PHI handling is governed by the executed BAA.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">3. Cross-border processing<\/h4><p style=\"font-size:14.5px\">Physician review is performed outside the United States. Cross-border processing is disclosed before records are accepted and proceeds only after BAA execution.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">4. AI-assisted processing<\/h4><p style=\"font-size:14.5px\">Where AI-assisted extraction is used for PHI-containing records, it is used only through systems covered by appropriate contractual safeguards. PHI is not entered into public consumer AI tools. Records are not used for model training.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">5. Data retention<\/h4><p style=\"font-size:14.5px\">Retention and deletion is governed by the executed BAA. Default practice is to retain only what is needed for the defined scope and to delete upon instruction or engagement close.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">6. Contact<\/h4><p style=\"font-size:14.5px\"><a href=\"mailto:contact@medisprudence.com\" style=\"color:var(--teal)\">contact@medisprudence.com<\/a><\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-terms\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">Terms of Use<\/div>\n    <h1 style=\"margin-top:10px\">Terms of Use<\/h1>\n    \n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\" style=\"max-width:720px\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\"><div><h4 style=\"margin-bottom:8px\">1. Services provided<\/h4><p style=\"font-size:14.5px\">Medisprudence provides physician-directed medical case intelligence under attorney supervision. All deliverables are for attorney use only, under attorney direction, and do not constitute legal advice, legal representation, independent expert testimony, expert affidavits, certificates of merit, patient care, or independent medical examinations.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">2. No relationships created<\/h4><p style=\"font-size:14.5px\">Use of this website or services does not create an attorney-client relationship, physician-patient relationship, or fiduciary relationship of any kind.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">3. No expert testimony<\/h4><p style=\"font-size:14.5px\">Medisprudence does not provide independent expert testimony, expert affidavits, certificates of merit, or court-facing causation opinions unless separately contracted under a different explicitly defined scope.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">4. No guarantee<\/h4><p style=\"font-size:14.5px\">Medisprudence makes no guarantee of case outcome, settlement value, admissibility of any analysis, or expert qualifications for any jurisdiction.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">5. Attorney responsibility<\/h4><p style=\"font-size:14.5px\">The retaining attorney is responsible for all legal strategy, case theory, and expert engagement decisions. Medisprudence deliverables are provided to support, not replace, attorney judgment.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">6. Compensation<\/h4><p style=\"font-size:14.5px\">Medisprudence is compensated via flat fees or hourly rates disclosed at scope. No contingent-fee arrangements are available.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">7. Conflict of interest<\/h4><p style=\"font-size:14.5px\">Medisprudence serves both plaintiff and defense clients and may decline engagements where a conflict exists. Conflict checks are conducted at intake. Medisprudence does not serve both sides of the same matter.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">8. Engagement formation<\/h4><p style=\"font-size:14.5px\">No engagement is formed until Medisprudence has confirmed scope, pricing, and BAA in writing.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-ai-use\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← Home<\/a>\n    <div class=\"label\">AI Use Disclosure<\/div>\n    <h1 style=\"margin-top:10px\">AI Use Disclosure<\/h1>\n    \n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\" style=\"max-width:720px\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\"><div><h4 style=\"margin-bottom:8px\">1. How AI is used<\/h4><p style=\"font-size:14.5px\">AI-assisted extraction is used in Stage 1 of the Medisprudence workflow — capturing dates, providers, diagnoses, procedures, and page references from medical records. This stage produces structured data, not intelligence. Stage 2 is physician-authored: the founding physician reviews extracted data against original records and applies all clinical intelligence layers. Final judgments and conclusions are physician-authored, not AI-generated.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">2. PHI and AI systems<\/h4><p style=\"font-size:14.5px\">Where AI-assisted extraction is used for PHI-containing records, it is used only through systems covered by appropriate contractual safeguards. PHI is not entered into public consumer AI tools. Records are not used for model training.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">3. Component-level disclosure<\/h4><p style=\"font-size:14.5px\">Every deliverable identifies AI-assisted versus physician-authored components at the component level. This supports counsel’s supervisory obligations under ABA Formal Opinion 512 and similar guidance.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">4. What AI does not do<\/h4><p style=\"font-size:14.5px\">AI does not generate clinical opinions, causation conclusions, deposition questions, vulnerability rankings, or any substantive analytical content in Medisprudence deliverables. All analytical and interpretive content is physician-authored.<\/p><\/div><div><h4 style=\"margin-bottom:8px\">5. Why we disclose this<\/h4><p style=\"font-size:14.5px\">This disclosure is intended to support informed attorney supervision and responsible use of AI-assisted medical record review in litigation contexts.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"p-svc-ime\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← All Services<\/a>\n    <div class=\"label\">Flagship Service<\/div>\n    <h1 style=\"margin-top:10px\">IME Report Deconstruction<\/h1>\n    <p class=\"hero-sub\">Every unsupported assertion. Every omitted medical fact. Every internal contradiction. Twenty or more physician-authored deposition questions — built from the weaknesses in the report itself.<\/p>\n    <div class=\"label-dim\" style=\"margin-top:12px\">From $500 · 3–5 business days · 10 sections delivered<\/div>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"founder-bar\"><div class=\"fb-label\">Founder’s Advantage<\/div><p><strong>Our founding physician has reviewed the same category of reports that defense IME physicians generate — across 3,000+ payer-side claim reviews.<\/strong> He knows not just what IME reports say, but what they are <em>constructed to accomplish<\/em> — the specific language designed to make a report Daubert-resistant, the boilerplate phrasing borrowed from payer-review templates, and exactly where those reports structurally fail under clinical scrutiny. This is not outside analysis. It is the same methodology, applied first-hand.<\/p><\/div>\n    <div class=\"svc-detail-grid\" style=\"margin-top:32px\">\n      <div><h3 style=\"font-size:clamp(18px,2.5vw,26px);margin-bottom:18px\">Ten sections delivered<\/h3>\n<ul class=\"deliverable-list\">\n<li><span class=\"dl-num\">01<\/span><div class=\"dl-text\"><h5>IME Conclusion Summary<\/h5><p>Plain-English summary of what the IME physician concluded and the reasoning structure used.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">02<\/span><div class=\"dl-text\"><h5>Unsupported Assertions<\/h5><p>Every conclusion not supported by the examining physician’s own documented findings or the treating record.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">03<\/span><div class=\"dl-text\"><h5>Omitted Medical Facts<\/h5><p>Material facts present in the treating record that the IME report does not acknowledge.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">04<\/span><div class=\"dl-text\"><h5>Internal Contradictions<\/h5><p>Where the IME physician’s own examination findings contradict their conclusions.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">05<\/span><div class=\"dl-text\"><h5>Record-Based Counterpoints<\/h5><p>Specific treating record entries that directly contradict IME positions, with page references.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">06<\/span><div class=\"dl-text\"><h5>Treatment Necessity Analysis<\/h5><p>Assessment of whether the contested treatment meets the documentation threshold typically applied by defense reviewers.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">07<\/span><div class=\"dl-text\"><h5>Pre-existing Condition Assessment<\/h5><p>How the IME physician handled prior pathology — and whether that handling is clinically defensible.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">08<\/span><div class=\"dl-text\"><h5>IME Methodology Assessment<\/h5><p>Whether the examination duration, tests performed, and records reviewed are consistent with stated conclusions.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">09<\/span><div class=\"dl-text\"><h5>Questions for Treating Physician<\/h5><p>Targeted questions to strengthen the treating physician’s documentation before expert engagement.<\/p><\/div><\/li>\n<li><span class=\"dl-num\">10<\/span><div class=\"dl-text\"><h5>Deposition Prep Questions (20+)<\/h5><p>Physician-authored questions for deposing the IME physician — each tied to a specific identified vulnerability.<\/p><\/div><\/li>\n<\/ul><\/div>\n      <div><h3 style=\"font-size:clamp(18px,2.5vw,26px);margin-bottom:18px\">When to use this<\/h3>\n<div class=\"when-grid\" style=\"grid-template-columns:1fr\">\n<div class=\"when-item\"><p>You have received a defense IME and need to understand where it is vulnerable before your expert responds to it.<\/p><\/div>\n<div class=\"when-item\"><p>You are preparing to depose the IME physician and need questions built from the record — not generic deposition templates.<\/p><\/div>\n<div class=\"when-item\"><p>The IME report uses payer-review language to justify a “no causal relationship” conclusion and you need a physician to identify where that language is unsupported.<\/p><\/div>\n<div class=\"when-item\"><p>You are approaching mediation and need to understand the defense medical position before you walk into the room.<\/p><\/div>\n<\/div>\n<div class=\"pricing-box\" style=\"margin-top:24px\">\n<div><div class=\"pi-label\">Starting Fee<\/div><div class=\"pi-value\">$500<\/div><div class=\"pi-note\">Scope-dependent<\/div><\/div>\n<div><div class=\"pi-label\">Turnaround<\/div><div class=\"pi-value\">3–5 days<\/div><div class=\"pi-note\">Rush available<\/div><\/div>\n<div><div class=\"pi-label\">Output<\/div><div class=\"pi-value\">10 sections<\/div><div class=\"pi-note\">Source-referenced<\/div><\/div>\n<\/div>\n<div style=\"margin-top:12px;padding:12px 16px;background:var(--teal-dim);border-radius:var(--r-md);border-left:3px solid var(--teal)\">\n<p style=\"font-size:14px;color:var(--ink);margin:0\">Advanceable as a case cost and recoverable at settlement in contingency-fee matters. <a href=\"/packages\" style=\"color:var(--teal-text);font-weight:600\">Bundle with the Defense Medical Lens™ from $800 →<\/a><\/p>\n<\/div>\n<a class=\"btn btn-primary\" href=\"/intake\" style=\"width:100%;margin-top:18px;justify-content:center\">Request IME Deconstruction →<\/a><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"sec-tight\" style=\"background:var(--teal-dim);border-top:1px solid rgba(122,31,43,.15)\">\n  <div class=\"wrap\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px\">\n      <div>\n        <div class=\"label\" style=\"margin-bottom:6px\">Specimen Deliverable<\/div>\n        <h4 style=\"font-size:17px;margin-bottom:5px\">See a full IME Deconstruction report<\/h4>\n        <p style=\"font-size:16px;margin:0;color:var(--ink)\">10 sections demonstrated with fictional clinical data. Orthopedic spine case. Real methodology, no PHI.<\/p>\n      <\/div>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <a class=\"btn btn-teal\" href=\"specimens/specimen-ime.html\" target=\"_blank\">View Sample →<\/a>\n        <a class=\"btn btn-ghost\" href=\"/samples\">All Samples<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"mini-cta\"><div class=\"wrap mini-cta-inner\">\n  <div><h3>Ready to deconstruct an IME?<\/h3><p>No records required to start — send only general case facts first.<\/p><\/div>\n  <a class=\"btn btn-teal\" href=\"/intake\">Request Case Review<\/a>\n<\/div><\/div>\n<\/div>\n<div id=\"p-svc-cva\" class=\"page\">\n<div class=\"page-hero\">\n  <div class=\"wrap\">\n    <a class=\"btn-back\" href=\"/\">← All Services<\/a>\n    <div class=\"label\">Case Viability Assessment — CVA™<\/div>\n    <h1 style=\"margin-top:10px\">Know if the case holds before you commit the expert.<\/h1>\n    <p class=\"hero-sub\">A physician-authored case screening memo calibrated to how the defense will challenge the record — not just whether the treatment was clinically appropriate.<\/p>\n    <div class=\"label-dim\" style=\"margin-top:12px\">Starting at $350 · 72 hours · 3–5 pages<\/div>\n  <\/div>\n<\/div>\n<div class=\"sec\">\n  <div class=\"wrap\">\n    <div class=\"founder-bar\"><div class=\"fb-label\">Founder’s Advantage<\/div><p><strong>Most case screening asks: “Was the treatment clinically appropriate?” We ask a second question that most physician consultants cannot answer: “How will a defense medical reviewer evaluate this record?”<\/strong> Because our founding physician has applied InterQual and MCG criteria first-hand on the payer side, the CVA is calibrated to the documentation-threshold
