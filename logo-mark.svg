<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#FAF7F1"/>
  
  <!-- Logo mark scaled to fit nicely in 512x512, centered -->
  <!-- Original viewBox 0 0 32 32, scale to ~320px centered in 512 -->
  <!-- Scale factor: 320/32 = 10, offset: (512-320)/2 = 96 -->
  <g transform="translate(96, 96) scale(10)">
    <!-- Vertical staff line -->
    <line x1="16" y1="4" x2="16" y2="29" stroke="#7A1F2B" stroke-width="1.9" stroke-linecap="round"/>
    <!-- Base horizontal line -->
    <line x1="10" y1="29" x2="22" y2="29" stroke="#7A1F2B" stroke-width="1.9" stroke-linecap="round"/>
    <!-- Scale beam -->
    <line x1="5" y1="11" x2="27" y2="11" stroke="#7A1F2B" stroke-width="1.9" stroke-linecap="round"/>
    <!-- Fulcrum dot -->
    <circle cx="16" cy="11" r="2.4" fill="#7A1F2B"/>
    <!-- Left pan chain -->
    <line x1="5" y1="11" x2="5" y2="19" stroke="#7A1F2B" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Left pan arc -->
    <path d="M1.5 19 Q5 24.5 8.5 19" stroke="#7A1F2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Right pan chain -->
    <line x1="27" y1="11" x2="27" y2="19" stroke="#7A1F2B" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Right pan arc -->
    <path d="M23.5 19 Q27 24.5 30.5 19" stroke="#7A1F2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
